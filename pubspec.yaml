name: rowmate
description: RowMate — Monitor de rower AMS-670B con rutinas de entrenamiento
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Bluetooth BLE
  flutter_blue_plus: 2.3.13

  # Base de datos
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Estado y navegación
  provider: ^6.1.2
  go_router: ^13.2.4

  # Utilidades
  path_provider: ^2.1.3
  intl: ^0.20.2
  wakelock_plus: ^1.2.5
  fl_chart: ^1.1.1

  # Strava integration
  flutter_web_auth_2: ^4.0.1
  flutter_secure_storage: ^9.2.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  sqflite_common_ffi: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  fake_async: ^1.3.3

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: assets/icon/icon.png
  image_path: assets/icon/icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/water.frag
  assets:
    - assets/icon/
